name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy changed production services to Railway after CI checks
        required: true
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mcp_gateway: ${{ steps.filter.outputs.mcp_gateway }}
      packages: ${{ steps.filter.outputs.packages }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-detect-changes.sh

  ci:
    name: Test and build
    runs-on: macos-latest
    env:
      NEXT_PUBLIC_APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: Run CI script
        run: bash scripts/ci.sh

  deploy-production:
    name: Deploy Production (Railway)
    needs: [changes, ci]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.mcp_gateway == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.ci == 'true') &&
      (
        (github.event_name == 'push' && github.ref_name == 'main') ||
        (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.deploy_production)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy Gateway
        if: needs.changes.outputs.mcp_gateway == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.ci == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: bash scripts/railway-deploy-production.sh main Gateway

      - name: Deploy Web
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.ci == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: bash scripts/railway-deploy-production.sh main Web
